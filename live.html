<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prestige Elysian Ganeshotsav 2026</title>
<meta name="theme-color" content="#6f0d17">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#2b080b; }
  body { overflow-x:hidden; }
  .poster {
    position:relative;
    width:100%;
    max-width:1024px;
    margin:0 auto;
    line-height:0;
    background:#2b080b;
  }
  .poster img {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .contribute-link {
    position:absolute;
    left:6.0%;
    top:78.0%;
    width:88.0%;
    height:6.8%;
    display:block;
    border-radius:999px;
    text-decoration:none;
    cursor:pointer;
    /* Keep the artwork visible; only a subtle interaction glow appears on hover. */
    background:transparent;
    transition:filter .2s ease, transform .2s ease;
  }
  .contribute-link:hover {
    filter:brightness(1.08);
    transform:scale(1.005);
  }
  .contribute-link:focus-visible {
    outline:3px solid #ffd66b;
    outline-offset:4px;
  }
  @media (max-width:600px) {
    .contribute-link { top:78.0%; height:6.8%; }
  }
</style>
</head>
<body>
<main class="poster" aria-label="Prestige Elysian Ganeshotsav 2026">
  <img src="ganeshotsav-fullpage.png"
       alt="Prestige Elysian Ganeshotsav 2026 celebration poster">
  <a class="contribute-link"
     href="https://tally.so/r/7R0ZPz"
     target="_blank"
     rel="noopener"
     aria-label="Contribute for Ganeshotsav"></a>
</main>
</body>
</html>
