<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Prestige Elysian Ganeshotsav 2026</title>

<meta name="theme-color" content="#2b080b">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-width: 0;
  background: #2b080b;
  overflow-x: hidden;
}

body {
  display: block;
}

.poster {
  position: relative;
  width: 100%;
  max-width: 1024px;
  margin: 0 auto;
  padding: 0;
  line-height: 0;
  background: #2b080b;
}

.poster img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-drag: none;
}


/* =========================================
   GANESHOTSAV CONTRIBUTION BUTTON
   ========================================= */

.contribute-link {
  position: absolute;

  left: 5%;
  top: 76.5%;
  width: 90%;
  height: 8.5%;

  display: block;

  z-index: 99999;

  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;

  text-decoration: none;

  background: rgba(255, 0, 0, 0.03);

  border-radius: 999px;

  -webkit-tap-highlight-color: transparent;
}

.contribute-link:active {
  background: rgba(255, 255, 255, 0.08);
}


/* =========================================
   MOBILE
   ========================================= */

@media screen and (max-width: 600px) {

  html,
  body {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  .poster {
    width: 100vw;
    max-width: 100vw;
    margin: 0;
    padding: 0;
  }

  .poster img {
    display: block;
    width: 100vw;
    max-width: 100vw;
    height: auto;
    margin: 0;
    padding: 0;
  }

  .contribute-link {
    left: 3%;
    top: 76%;
    width: 94%;
    height: 9%;

    z-index: 99999;
  }
}
</style>
</head>


<body>

<main
  class="poster"
  aria-label="Prestige Elysian Ganeshotsav 2026">

  <!-- MAIN GANESHOTSAV POSTER -->
  <img
    src="ganeshotsav-fullpage.png"
    alt="Prestige Elysian Ganeshotsav 2026 celebration poster">


  <!-- CLICKABLE CONTRIBUTION AREA -->
  <a
    id="contributeButton"
    class="contribute-link"
    href="https://tally.so/r/7R0ZPz"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contribute for Ganeshotsav"
    title="Contribute for Ganeshotsav">
  </a>


  <!-- ECO-FRIENDLY GANESHA WORKSHOP POSTER -->
  <img
    class="eco-poster"
    src="eco-ganesha-workshop-2026.png"
    alt="Make Your Own Eco Friendly Ganesha 2026">

</main>


<script>

/*
   Mobile-safe contribution button
*/

document
  .getElementById("contributeButton")
  .addEventListener("click", function(event) {

    event.preventDefault();

    window.location.href = "https://tally.so/r/7R0ZPz";

  });

</script>

</body>
</html>
