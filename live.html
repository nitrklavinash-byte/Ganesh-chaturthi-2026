<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>Prestige Elysian Ganeshotsav 2026</title>

<meta name="theme-color" content="#2b080b">

<style>
 * {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  background: #2b080b;
}

body {
  display: block;
}

.poster {
  position: relative;
  display: block;

  width: 100%;
  max-width: 1024px;

margin-left: auto;
margin-right: auto;
  padding: 0;

  line-height: 0;
  background: #2b080b;

  overflow: hidden;
}

.poster img {
  display: block;

  width: 100%;
  max-width: 100%;
  height: auto;

  margin: 0;
  padding: 0;

  user-select: none;
  -webkit-user-drag: none;
}

.contribute-link {
  position: absolute;

  left: 6%;
  top: 78%;

  width: 88%;
  height: 6.8%;

  display: block;

  border-radius: 999px;

  text-decoration: none;
  cursor: pointer;

  background: transparent;

  transition: filter .2s ease, transform .2s ease;
}

.contribute-link:hover {
  filter: brightness(1.08);
  transform: scale(1.005);
}

.contribute-link:active {
  transform: scale(.99);
}

.contribute-link:focus-visible {
  outline: 3px solid #ffd66b;
  outline-offset: 4px;
}

/* MOBILE */
@media screen and (max-width: 600px) {

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow-x: hidden;
    background: #2b080b;
  }

  .poster {
    position: relative;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .poster img {
    display: block;
    width: 100%;
    height: auto;
    max-width: none;
    margin: 0;
    padding: 0;
  }

  .contribute-link {
    left: 6%;
    top: 78%;
    width: 88%;
    height: 6.8%;
  }
}
</style>
</head>

<body>

<main
  class="poster"
  aria-label="Prestige Elysian Ganeshotsav 2026">

  <img
    src="ganeshotsav-fullpage.png"
    alt="Prestige Elysian Ganeshotsav 2026 celebration poster">

  <a
    class="contribute-link"
    href="https://tally.so/r/7R0ZPz"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Contribute for Ganeshotsav">
  </a>

</main>

</body>
</html>
