<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestige Elysian Ganeshotsav 2026</title>

<meta name="theme-color" content="#2b080b">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-width: 0;
  background: #2b080b;
  overflow-x: hidden;
}

body {
  display: block;
}

.poster {
  position: relative;
  width: 100%;
  max-width: 1024px;
  margin: 0 auto;
  padding: 0;
  line-height: 0;
  background: #2b080b;
}

.poster img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
}

/* ================================
   CONTRIBUTION CLICK AREA
   ================================ */

.contribute-link {
  position: absolute;

  /*
    This is positioned over the
    CONTRIBUTION button in the artwork.
  */
  left: 4%;
  top: 76%;
  width: 92%;
  height: 10%;

  display: block;

  z-index: 9999;

  cursor: pointer;
  pointer-events: auto;
  touch-action: manipulation;

  text-decoration: none;

  /*
    Almost invisible but still a real
    clickable element.
  */
  background: rgba(255, 0, 0, 0.01);

  border-radius: 999px;

  -webkit-tap-highlight-color: transparent;
}

/* Desktop */
@media screen and (min-width: 601px) {
  .poster {
    width: 100%;
    max-width: 1024px;
  }
}

/* Mobile */
@media screen and (max-width: 600px) {

  html,
  body {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  .poster {
    width: 100vw;
    max-width: 100vw;
    min-width: 0;
    margin: 0;
    padding: 0;
  }

  .poster img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
  }

  .contribute-link {
    left: 4%;
    top: 76%;
    width: 92%;
    height: 10%;

    z-index: 9999;
    pointer-events: auto;
    touch-action: manipulation;
  }
}
</style>
</head>

<body>

<main
  class="poster"
  aria-label="Prestige Elysian Ganeshotsav 2026">

  <img
    src="ganeshotsav-fullpage.png"
    alt="Prestige Elysian Ganeshotsav 2026 celebration poster">

  <a
    class="contribute-link"
  href="https://tally.so/r/7R0ZPz"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Contribute for Ganeshotsav"
  title="Contribute for Ganeshotsav">
  </a>

</main>

</body>
</html>
